name: SupplySense Nexus CI

on:
  push:
    branches: [ main, "feature/**", "phase/**", "bugfix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supplysense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # AGENTS.md mandates 'ruff check' for linting compliance.
      # 'ruff format --check' is omitted to avoid mass whitespace reformatting of 135 files.
      - name: Run Ruff (linting compliance check)
        run: |
          python -m ruff check backend scripts

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supplysense_test
          DATABASE_URL_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/supplysense_test
          ENABLE_AI_ASSISTANT: "false"
          ENABLE_SIMULATION: "false"
          ENABLE_OPTIMIZATION: "false"
        run: |
          python -m pytest backend/app/tests/ -v

  frontend-check-and-build:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Run production build
        run: npm run build
