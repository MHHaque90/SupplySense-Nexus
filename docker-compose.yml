# SupplySense Nexus - Local Development & Evaluation Orchestration
# SECURITY NOTICE: This compose specification is configured for local development and testing.
# Default credentials (${POSTGRES_PASSWORD:-postgres}) are provided for developer convenience.
# For production deployments, define POSTGRES_PASSWORD, POSTGRES_USER, and POSTGRES_DB
# in an untracked environment file or secure secrets store; never deploy with default credentials.

version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: supplysense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplysense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplysense-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supplysense}
      HOST: "0.0.0.0"
      PORT: "8000"
      ENABLE_AI_ASSISTANT: "false"
      ENABLE_SIMULATION: "false"
      ENABLE_OPTIMIZATION: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080","http://localhost:5173","http://localhost:8010"]'
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplysense-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
